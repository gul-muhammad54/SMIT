<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up - Inventory Manager</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="brand">Inventory Manager</h1>
        <h2>Create account</h2>
        <form id="signupForm">
          <label for="signupName">Full name</label>
          <input type="text" id="signupName" placeholder="Your name" />

          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" />

          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="At least 6 characters"
          />

          <label for="signupConfirm">Confirm password</label>
          <input
            type="password"
            id="signupConfirm"
            placeholder="Type it again"
          />

          <button type="button" id="signupBtn" class="btn btn-primary btn-full">
            Sign up
          </button>
        </form>
        <p class="switch-text">
          Already have an account? <a href="#" id="goToLogin">Log in</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/signup.js"></script>
  </body>
</html>
