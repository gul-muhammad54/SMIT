<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password - Inventory Manager</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/forget-password.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="brand">Inventory Manager</h1>
        <h2>Forgot password</h2>
        <p class="hint">Enter your email and we will send you a reset code.</p>
        <form id="forgotForm">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" />

          <button
            type="button"
            id="sendCodeBtn"
            class="btn btn-primary btn-full"
          >
            Send code
          </button>
        </form>
        <p class="switch-text"><a href="#" id="goToLogin">Back to log in</a></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/forgetpassword.js"></script>
  </body>
</html>
