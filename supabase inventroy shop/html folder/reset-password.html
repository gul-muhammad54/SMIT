<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password - Inventory Manager</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reset-password.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="brand">Inventory Manager</h1>
        <h2>Reset password</h2>
        <form id="resetForm">
          <label for="resetCode">Code</label>
          <input type="text" id="resetCode" placeholder="6 digit code" />

          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="New password" />

          <label for="confirmNewPassword">Confirm new password</label>
          <input
            type="password"
            id="confirmNewPassword"
            placeholder="Type it again"
          />

          <button type="button" id="resetBtn" class="btn btn-primary btn-full">
            Reset password
          </button>
        </form>
        <p class="switch-text"><a href="#" id="goToLogin">Back to log in</a></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/reset-password.js"></script>
  </body>
</html>
