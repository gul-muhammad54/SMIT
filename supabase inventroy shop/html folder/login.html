<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - Inventory Manager</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="brand">Inventory Manager</h1>
        <h2>Log in</h2>
        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />

          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Your password"
          />

          <div class="row-between">
            <label class="check"
              ><input type="checkbox" id="rememberMe" /> Remember me</label
            >
            <a href="#" id="goToForgot">Forgot password?</a>
          </div>

          <button type="button" id="loginBtn" class="btn btn-primary btn-full">
            Log in
          </button>
        </form>
        <p class="switch-text">
          No account? <a href="#" id="goToSignup">Sign up</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
