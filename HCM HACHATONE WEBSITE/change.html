<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - HCM Lite</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/change.css" />
  </head>

  <body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
      <a class="brand" href="#">
        <b>H</b>HCM Lite <span class="badge-lite">Security</span>
      </a>
      <div class="nav-right">
        <button class="btn-outline" id="btnLogout">Logout</button>
      </div>
    </nav>

    <!-- Change Password Form Container -->
    <div class="auth-wrapper">
      <div class="signup-container">
        <h1>Set New Password</h1>
        <p class="subtitle">Update your password to activate full access to your account</p>

        <div class="security-alert-box">
          <span>🔒</span>
          <span>For security, please set a new permanent password before proceeding.</span>
        </div>

        <form id="changePasswordForm" onsubmit="return false;">
          <div class="form-group">
            <label for="newPassword">New Password (min 6 characters)</label>
            <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
          </div>

          <button type="button" id="btnChangePassword" class="signup-btn">Save Password</button>
        </form>
      </div>
    </div>

    <!-- ES Module Script -->
    <script type="module" src="js/change.js"></script>
  </body>
</html>
