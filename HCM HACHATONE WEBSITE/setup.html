<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Run Setup - HCM Lite</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/setup.css" />
  </head>

  <body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">
        <b>H</b>HCM Lite <span class="badge-lite">Setup</span>
      </a>
      <div class="nav-right">
        <a class="btn-outline" href="login.html">Login</a>
      </div>
    </nav>

    <!-- Setup Form Container -->
    <div class="auth-wrapper">
      <div class="signup-container">
        <div style="text-align: center;">
          <span class="setup-step-pill">Initial System Setup</span>
        </div>
        <h1>Setup HCM Lite</h1>
        <p class="subtitle">Initialize your company workspace and the primary Admin account</p>

        <form id="setupForm" onsubmit="return false;">
          <div class="form-group">
            <label for="companyName">Company Name</label>
            <input type="text" id="companyName" placeholder="e.g. Acme Corp" autocomplete="organization" />
          </div>

          <div class="form-group">
            <label for="adminName">Admin Full Name</label>
            <input type="text" id="adminName" placeholder="e.g. John Doe" autocomplete="name" />
          </div>

          <div class="form-group">
            <label for="adminEmail">Admin Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@acmecorp.com" autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="password">Password (min 6 characters)</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
          </div>

          <button type="button" id="btnSetup" class="signup-btn">Initialize Company</button>
        </form>

        <p class="login-text">
          Already configured? <a href="login.html">Sign in here</a>
        </p>
      </div>
    </div>

    <!-- ES Module Script -->
    <script type="module" src="js/setup.js"></script>
  </body>
</html>
