<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements - HCM Lite</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/announcements.css" />
  </head>

  <body>
    <!-- Top Role-based Dynamic Navbar -->
    <nav class="navbar">
      <a class="brand" href="dashboard.html">
        <b>H</b>HCM Lite
      </a>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-right">
        <div class="user-pill">
          <div class="profile-circle" id="profileCircle">U</div>
          <span id="profileName">User</span>
        </div>
        <button class="btn-outline" id="btnLogout">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <header class="page-head">
        <h1>Company Announcements</h1>
        <p>Stay informed with official circulars, holiday notices, and organizational updates</p>
      </header>

      <main class="container">
        <!-- Create Announcement Toolbar (HR & Admin) -->
        <div class="top-bar" id="announcementToolbar" style="display: none;">
          <button class="add-btn" type="button" id="btnOpenAnnModal">+ Post New Announcement</button>
        </div>

        <!-- Announcements Feed -->
        <div id="announcementsFeed" style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Rendered by announcements.js -->
        </div>
      </main>
    </div>

    <!-- Post Announcement Modal -->
    <div class="modal" id="annModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Post Company Announcement</h2>
          <button type="button" class="close" id="btnCloseAnnModal">&times;</button>
        </div>
        <form id="annForm" onsubmit="return false;">
          <div class="form-group">
            <label for="annTitle">Announcement Subject / Headline *</label>
            <input type="text" id="annTitle" placeholder="e.g. Office Timings Update for Summer" />
          </div>
          <div class="form-group">
            <label for="annBody">Announcement Content *</label>
            <textarea id="annBody" rows="4" placeholder="Enter the detailed official circular notice..."></textarea>
          </div>
          <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <button type="button" class="small-btn grey" id="btnCancelAnn">Cancel</button>
            <button type="button" class="add-btn" id="btnSaveAnn">Publish Announcement</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ES Module Script -->
    <script type="module" src="js/announcements.js"></script>
  </body>
</html>
