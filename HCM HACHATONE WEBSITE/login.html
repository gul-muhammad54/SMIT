<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HCM Lite</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">
        <b>H</b>HCM Lite
      </a>
      <div class="nav-right">
        <a class="btn-outline" href="setup.html">First-time Setup</a>
      </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-wrapper">
      <div class="signup-container">
        <div class="login-header-icon">H</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your Admin, HR, or Employee account</p>

        <form id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label for="email">Work Email</label>
            <input type="email" id="email" placeholder="name@company.com" autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          </div>

          <button type="button" id="btnLogin" class="signup-btn">Sign In</button>
        </form>

        <p class="login-text">
          First time here? <a href="setup.html">Complete company setup</a>
        </p>
      </div>
    </div>

    <!-- ES Module Script -->
    <script type="module" src="js/login.js"></script>
  </body>
</html>
